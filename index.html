<!doctype html>
<html lang="en" class="js-loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>최서영</title>
  <meta name="description" content="Organist Seoyoung Choi (최서영) — Korea · Europe · USA">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="assets/js/supabase-config.js" defer></script>
  <script src="assets/js/data.js" defer></script>
  <script src="assets/js/i18n.js" defer></script>
  <script src="assets/js/content.js" defer></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body data-page="about" data-title="home">
<header class="site-header" id="site-header"></header>
<main id="main" class="wrap">

  <!-- PROFILE / HERO -->
  <section class="card hero" aria-labelledby="hero-title">
    <div class="hero__photos">
      <div class="media" data-photo="hero1" style="--img:url('assets/images/hero-1.jpg')" role="img" aria-label=""></div>
      <div class="media" data-photo="hero2" style="--img:url('assets/images/hero-2.jpg')" role="img" aria-label=""></div>
      <div class="media" data-photo="hero3" style="--img:url('assets/images/hero-3.jpg')" role="img" aria-label=""></div>
    </div>
    <div class="hero__meta">
      <div class="socials" data-socials></div>
    </div>
    <div class="hero__title">
      <h1 class="display display--name" id="hero-title" data-i18n="common.name"></h1>
      <p class="label" data-i18n="home.role"></p>
    </div>
  </section>


  <!-- PROFILE -->
  <section class="card" aria-labelledby="profile-title">
    <div class="profile">
      <div class="media" data-photo="aboutPortrait" style="--img:url('assets/images/about-portrait.jpg')"></div>
      <div>
        <div class="profile__meta label">
          <span data-i18n="common.nameLatin"></span>
        </div>
        <div class="bio" id="bio"></div>
      </div>
    </div>
    <div class="profile__title">
      <h2 class="display" id="profile-title" data-i18n="about.title"></h2>
    </div>
  </section>

  <!-- EDUCATION -->
  <section class="card" aria-labelledby="edu-title">
    <div class="card__head">
      <h2 class="display display--md" id="edu-title" data-i18n="about.eduTitle"></h2>
    </div>
    <ul class="rows" id="education"></ul>
    <h3 class="label subhead" data-i18n="about.extraTitle"></h3>
    <ul class="rows" id="extra"></ul>
  </section>

  <!-- PRIZES / ORCHESTRA -->
  <section class="card">
    <div class="split">
      <div>
        <h2 class="display display--sm" data-i18n="about.awardsTitle"></h2>
        <ul class="ulist" id="awards"></ul>
      </div>
      <div>
        <h2 class="display display--sm" data-i18n="about.orchTitle"></h2>
        <ul class="ulist" id="orchestras"></ul>
      </div>
    </div>
  </section>

  <!-- VENUES -->
  <section class="card" aria-labelledby="venues-title">
    <div class="card__head">
      <h2 class="display display--md" id="venues-title" data-i18n="about.venuesTitle"></h2>
    </div>
    <ul class="venues" id="venues"></ul>
  </section>

  <!-- TEACHERS -->
  <section class="card" aria-labelledby="teachers-title">
    <div class="card__head">
      <h2 class="display display--md" id="teachers-title" data-i18n="about.teachersTitle"></h2>
    </div>
    <div class="teachers" id="teachers"></div>
  </section>

</main>
<footer class="site-footer" id="site-footer"></footer>
</body>
</html>
